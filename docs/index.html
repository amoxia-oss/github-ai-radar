<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>GitHub AI Radar</title>
  <meta name="description" content="GitHubで急上昇しているAIツールを継続監視するダッシュボード" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">OPEN SOURCE INTELLIGENCE</div>
        <h1>GitHub AI Radar</h1>
        <p>GitHub上の人気AIツールを、総Star数ではなく「直近の伸び」で発見。</p>
      </div>
      <div class="status" id="status">Loading…</div>
    </header>

    <section class="metrics" id="metrics"></section>

    <section class="controls">
      <label class="search">
        <span>検索</span>
        <input id="search" type="search" placeholder="repo / 説明 / topic" />
      </label>
      <label>
        <span>カテゴリ</span>
        <select id="category"><option value="all">すべて</option></select>
      </label>
      <label>
        <span>並び替え</span>
        <select id="sort">
          <option value="trend">急上昇スコア</option>
          <option value="stars7d">7日Star増加</option>
          <option value="growth">7日成長率</option>
          <option value="stars">総Star数</option>
          <option value="new">新しい順</option>
        </select>
      </label>
      <label class="toggle"><input id="alertsOnly" type="checkbox" /> <span>注目のみ</span></label>
    </section>

    <section class="legend">
      <span><b>Trend Score</b> = 7日Star増加 45% / 成長率 20% / 30日Star増加 15% / 更新頻度 10% / 総Star数 10%</span>
    </section>

    <section id="cards" class="cards" aria-live="polite"></section>
    <footer>Data source: GitHub REST API · Auto-updated by GitHub Actions</footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
